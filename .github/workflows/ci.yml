name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guest_platform
          POSTGRES_PASSWORD: guest_platform
          POSTGRES_DB: guest_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guest_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://guest_platform:guest_platform@localhost:5432/guest_platform
      APP_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Migrations are re-runnable
        run: pnpm db:migrate
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target web -t guest-platform-web .
      - run: docker build --target worker -t guest-platform-worker .
